name: mirror
run-name: mirror-${{ inputs.task_id }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: '源镜像完整地址（含 registry）'
        required: true
      tag:
        description: '镜像 tag'
        required: true
        default: 'latest'
      arch:
        description: '架构'
        required: true
        default: 'amd64'
      target:
        description: '目标镜像完整地址'
        required: true
      task_id:
        description: '后端任务 ID（用于状态回写匹配，workflow 内不使用）'
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      SWR_REGISTRY: ${{ secrets.SWR_REGISTRY }}
      SWR_AK: ${{ secrets.SWR_AK }}
      SWR_SK: ${{ secrets.SWR_SK }}
    steps:
      - name: 登录华为云 SWR
        run: |
          # 从 registry 地址提取 region：swr.cn-east-3.myhuaweicloud.com -> cn-east-3
          REGION=$(echo "$SWR_REGISTRY" | sed 's/swr\.\(.*\)\.myhuaweicloud.com/\1/')
          # 用 AK+SK 计算 SWR 长期登录密钥（HMAC-SHA256）
          LOGIN_KEY=$(printf "$SWR_AK" | openssl dgst -binary -sha256 -hmac "$SWR_SK" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          echo "$LOGIN_KEY" | docker login "$SWR_REGISTRY" -u "${REGION}@${SWR_AK}" --password-stdin

      - name: 拉取源镜像
        run: |
          docker pull --platform linux/${{ github.event.inputs.arch }} ${{ github.event.inputs.source }}:${{ github.event.inputs.tag }}

      - name: 打标签
        run: |
          docker tag ${{ github.event.inputs.source }}:${{ github.event.inputs.tag }} ${{ github.event.inputs.target }}

      - name: 推送目标镜像
        run: |
          docker push ${{ github.event.inputs.target }}
